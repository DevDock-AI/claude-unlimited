name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # The install and service backends are only verified on macOS today (see
    # docs/adr/0005-*.md). The suite mocks every OS-level call so it runs the
    # same anywhere, but macOS is what matches a real user's environment.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `python -m pip`, never bare `pip`: on the macOS runners a bare `pip`
      # can resolve to a different interpreter than the one setup-python just
      # provisioned, installing the package somewhere the test step cannot
      # import it from.
      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show the resolved environment
        run: |
          python -c "import sys; print(sys.executable); print(sys.version)"
          python -m pytest --version

      - name: Run the test suite
        run: python -m pytest tests/ -v

      - name: Check JS syntax
        run: node --check claude_unlimited/static/app.js
