name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit rather than inherited: this workflow only ever reads the code, and
# it runs on pull requests, including from forks.
permissions:
  contents: read

jobs:
  test:
    # macOS is what matches most users' environment; Linux is here because a
    # test that fakes the platform the wrong way passes on a Mac and fails
    # everywhere else — one did, caught only by running the suite on Linux by
    # hand. Windows joins once the suite is green on real Windows hardware.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `python -m pip`, never bare `pip`: on the macOS runners a bare `pip`
      # can resolve to a different interpreter than the one setup-python just
      # provisioned, installing the package somewhere the test step cannot
      # import it from.
      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show the resolved environment
        run: |
          python -c "import sys; print(sys.executable); print(sys.version)"
          python -m pytest --version

      - name: Run the test suite
        run: python -m pytest tests/ -v

      # Only needs to run once; node is preinstalled on both runner images.
      - name: Check JS syntax
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: node --check claude_unlimited/static/app.js
